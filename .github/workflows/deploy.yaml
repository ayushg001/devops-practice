
name: MERN CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # 1. Download application source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Run Trivy scan on the source code
      - name: Trivy scan - Source
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: '0'


      # 3. Verify the frontend builds successfully
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # 4. Build both Docker images with a unique tag
      - name: Build backend image
        run: |
          docker build \
            -t ayushg001/test-devops-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ayushg001/test-devops-frontend:${{ github.sha }} \
            ./frontend

            
      # 5. Scan backend Docker image
      - name: Trivy scan - Backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ayushg001/test-devops-backend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      # 6. Scan frontend Docker image
      - name: Trivy scan - Frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ayushg001/test-devops-frontend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'


      # 7. Authenticate with Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. Publish both images
      - name: Push Docker images
        run: |
          docker push ayushg001/test-devops-backend:${{ github.sha }}
          docker push ayushg001/test-devops-frontend:${{ github.sha }}

      # 9. Clone the GitOps repository and update image tags
      - name: Update GitOps repository
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
          BACKEND_IMAGE: ayushg001/test-devops-backend:${{ github.sha }}
          FRONTEND_IMAGE: ayushg001/test-devops-frontend:${{ github.sha }}
        run: |
          set -euo pipefail

          # Clear any inherited extraheaders from actions/checkout
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true

          # Clone GitOps repository into a dedicated directory
          git clone \
            "https://x-access-token:${GITOPS_TOKEN}@github.com/ayushg001/${GITOPS_REPO}.git" \
            gitops-repo

          cd gitops-repo

          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git remote set-url origin "https://x-access-token:${GITOPS_TOKEN}@github.com/ayushg001/${GITOPS_REPO}.git"

          # 9.1 Install yq to edit YAML safely if not already installed
          if ! command -v yq >/dev/null 2>&1; then
            sudo wget -qO /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi

          # 9.2 Update the backend container image
          yq -i \
            '(.spec.template.spec.containers[] | select(.name == "backend")).image = strenv(BACKEND_IMAGE)' \
            apps/devops/backend-deployment.yaml

          # 9.3 Update the frontend container image
          yq -i \
            '(.spec.template.spec.containers[] | select(.name == "frontend")).image = strenv(FRONTEND_IMAGE)' \
            apps/devops/frontend-deployment.yaml

          # Display changes for CI verification
          echo "Updated GitOps manifests:"
          git diff

          # 9.4 Commit and push the desired-state change
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/devops/backend-deployment.yaml apps/devops/frontend-deployment.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git commit -m "Deploy application ${GITHUB_SHA}"
          git push origin HEAD
