
name: MERN CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # 1. Download application source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Verify the frontend builds successfully
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # 3. Build both Docker images with a unique tag
      - name: Build backend image
        run: |
          docker build \
            -t ayushg001/test-devops-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ayushg001/test-devops-frontend:${{ github.sha }} \
            ./frontend

      # 4. Authenticate with Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Publish both images
      - name: Push Docker images
        run: |
          docker push ayushg001/test-devops-backend:${{ github.sha }}
          docker push ayushg001/test-devops-frontend:${{ github.sha }}

      # 6. Clone the GitOps repository and update image tags
      - name: Update GitOps repository
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPO: ${{ secrets.GITOPS_REPO }}
          BACKEND_IMAGE: ayushg001/test-devops-backend:${{ github.sha }}
          FRONTEND_IMAGE: ayushg001/test-devops-frontend:${{ github.sha }}
        run: |
          set -e

          git clone \
            "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git"

          # 6.1 Install yq to edit YAML safely

          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          # 6.2 Update the backend container image
          yq -i \
            '(.spec.template.spec.containers[] | select(.name == "backend") | .image) = strenv(BACKEND_IMAGE)' \
            gitops/apps/devops/backend-deployment.yaml

          # 6.3 Update the frontend container image
          yq -i \
            '(.spec.template.spec.containers[] | select(.name == "frontend") | .image) = strenv(FRONTEND_IMAGE)' \
            gitops/apps/devops/frontend-deployment.yaml

          # 6.4 Commit and push the desired-state change
      
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/devops/backend-deployment.yaml
          git add apps/devops/frontend-deployment.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git commit -m "Deploy application ${GITHUB_SHA}"
          git push origin HEAD
