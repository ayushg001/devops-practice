
# SonarQube Cloud project configuration
sonar.projectKey=ayushg001_devops-practice
sonar.organization=ayushg001

# Scan frontend and backend source code
sonar.sources=frontend/src,backend

# Ignore generated files and installed dependencies
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/package-lock.json

# Exclude all files from code coverage analysis since no unit test suite is configured
sonar.coverage.exclusions=**

sonar.sourceEncoding=UTF-8
